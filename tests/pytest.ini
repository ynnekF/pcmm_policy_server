#
# py.test configuration file.
#
[pytest]
# configure py.test naming conventions.
python_files=tp*.py reg*.py
python_classes=TestCase*
python_functions=tp*

# configure test search path(s).
testpaths=policy_server

# configure logging format for py.test
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S